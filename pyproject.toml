[project]
name = "agent-runtime-lab"
version = "0.1.0"
description = "Educational Python agent runtime optimization lab with contract and parity gates."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["tests/fixtures/supplied_optimized.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "PLW1510"]

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "tests.fixtures.supplied_optimized"
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
